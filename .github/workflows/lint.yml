name: Lint & Format

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: macos-26
    steps:
      - name: Checkout FasterSwiper
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab
        with:
          disk-cache: true
          repository-cache: true

      - name: Install Aspect CLI
        run: brew install aspect-build/aspect/aspect

      - name: Check Formatting
        run: aspect format --severity=fail

      - name: Lint
        run: aspect lint
