name: Lint & Format

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: macos-26
    steps:
      - name: Checkout FasterSwiper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab
        with:
          disk-cache: true
          repository-cache: true

      - name: Install Aspect CLI
        run: brew install aspect-build/aspect/aspect

      - name: Check Formatting
        run: aspect format --severity=fail

      - name: Lint
        run: aspect lint
